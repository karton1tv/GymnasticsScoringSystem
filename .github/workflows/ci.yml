name: CI/CD Pipeline - Gymnastics Scoring System

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ==========================================================
  # СТАДИЯ 1: test (Сборка, тесты, покрытие)
  # ==========================================================
  test:
    runs-on: windows-latest
    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Установить .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Скачать библиотеки
        run: dotnet restore

      - name: Собрать решение
        run: dotnet build --no-restore --configuration Release

      - name: Запустить тесты с покрытием (исключая UI-тесты)
        run: dotnet test GymnasticsScoringSystem.Tests/GymnasticsScoringSystem.Tests.csproj --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage --filter "FullyQualifiedName!~UiAutomationTests"

      - name: Установить ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Сгенерировать HTML-отчёт о покрытии
        run: reportgenerator -reports:./coverage/**/coverage.cobertura.xml -targetdir:./coverage-report -reporttypes:Html

      - name: Сохранить отчёт как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: ./coverage-report/
        if: always()

      - name: Проверить порог покрытия
        run: |
          # 1. Находим XML-файл с покрытием
          $coverageFile = Get-ChildItem -Path ./coverage -Recurse -Filter "coverage.cobertura.xml" | Select-Object -First 1
          if ($null -eq $coverageFile) {
            Write-Error "Файл coverage.cobertura.xml не найден!"
            exit 1
          }
          
          # 2. Читаем и парсим XML
          $content = Get-Content $coverageFile.FullName -Raw -Encoding UTF8
          $xml = [xml]$content
          
          # 3. Извлекаем line-rate надёжным способом
          $lineRate = $xml.coverage.GetAttribute('line-rate')
          
          # Если атрибут пустой или равен 0, вычисляем вручную
          if ([string]::IsNullOrWhiteSpace($lineRate) -or $lineRate -eq '0') {
            $covered = [double]$xml.coverage.GetAttribute('lines-covered')
            $total   = [double]$xml.coverage.GetAttribute('lines-valid')
            if ($total -gt 0) {
              $lineRate = $covered / $total
            } else {
              $lineRate = 0
            }
          }
          
          $coveragePercent = [math]::Round([double]$lineRate * 100, 2)
          Write-Host "Покрытие кода: $coveragePercent%"
          
          # 4. Проверка порога (снижен до 35% для WPF-проекта без UI-тестов)
          $threshold = 35
          if ($coveragePercent -lt $threshold) {
            Write-Error "Покрытие кода ($coveragePercent%) ниже порога $threshold%!"
            exit 1
          }
          Write-Host "Покрытие кода соответствует порогу ($threshold%)!"
        shell: pwsh

  # ==========================================================
  # СТАДИЯ 2: integration (Интеграционные тесты)
  # ==========================================================
  integration:
    runs-on: windows-latest
    needs: test
    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Установить .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Скачать библиотеки
        run: dotnet restore

      - name: Собрать решение
        run: dotnet build --no-restore --configuration Release

      - name: Запустить интеграционные тесты (исключая UI-тесты)
        run: dotnet test GymnasticsScoringSystem.Tests/GymnasticsScoringSystem.Tests.csproj --no-build --verbosity normal --filter "FullyQualifiedName!~UiAutomationTests"

  # ==========================================================
  # СТАДИЯ 3: report (Публикация отчётов)
  # ==========================================================
  report:
    runs-on: windows-latest
    needs: integration
    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Установить .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Скачать библиотеки
        run: dotnet restore

      - name: Собрать решение
        run: dotnet build --no-restore --configuration Release

      - name: Запустить тесты с покрытием для финального отчёта
        run: dotnet test GymnasticsScoringSystem.Tests/GymnasticsScoringSystem.Tests.csproj --no-build --collect:"XPlat Code Coverage" --results-directory ./coverage --filter "FullyQualifiedName!~UiAutomationTests"

      - name: Установить ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Сгенерировать финальный HTML-отчёт
        run: reportgenerator -reports:./coverage/**/coverage.cobertura.xml -targetdir:./coverage-report-final -reporttypes:Html

      - name: Сохранить финальный отчёт как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: final-coverage-report
          path: ./coverage-report-final/
        if: always()