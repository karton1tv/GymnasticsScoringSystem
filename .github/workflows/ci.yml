name: CI/CD Pipeline - Gymnastics Scoring System

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name:   Скачать код
        uses: actions/checkout@v4

      - name:  Установить .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name:  Скачать библиотеки
        run: dotnet restore

      - name:  Собрать решение
        run: dotnet build --no-restore --configuration Release

      - name:  Запустить тесты (ИСКЛЮЧАЯ UI-тесты)
        run: dotnet test GymnasticsScoringSystem.Tests/GymnasticsScoringSystem.Tests.csproj --no-build --verbosity normal --filter "FullyQualifiedName!~UiAutomationTests"

  integration:
    runs-on: windows-latest
    needs: test
    steps:
      - name:   Скачать код
        uses: actions/checkout@v4

      - name:  Установить .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name:  Скачать библиотеки
        run: dotnet restore

      - name:  Собрать решение
        run: dotnet build --no-restore --configuration Release

      - name:  Интеграционные тесты (ИСКЛЮЧАЯ UI-тесты)
        run: dotnet test GymnasticsScoringSystem.Tests/GymnasticsScoringSystem.Tests.csproj --no-build --verbosity normal --filter "FullyQualifiedName!~UiAutomationTests"

  report:
    runs-on: windows-latest
    needs: integration
    steps:
      - name:   Скачать код
        uses: actions/checkout@v4

      - name:  Установить .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Скачать библиотеки
        run: dotnet restore

      - name: Собрать решение
        run: dotnet build --no-restore --configuration Release

      - name: Тесты с покрытием (ИСКЛЮЧАЯ UI-тесты)
        run: dotnet test GymnasticsScoringSystem.Tests/GymnasticsScoringSystem.Tests.csproj --no-build --collect:"XPlat Code Coverage" --results-directory ./coverage --filter "FullyQualifiedName!~UiAutomationTests"

      - name: Сохранить отчёт
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: ./coverage/
        if: always()